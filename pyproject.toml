[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-ge-analyser"
version = "0.1.0"
description = "Old School RuneScape Grand Exchange analyser: finds profitable buy/sell flips using the OSRS Wiki real-time prices API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ge-analyser = "ge_analyser.cli:main"

[tool.setuptools.packages.find]
include = ["ge_analyser*"]
